name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.0'

      - name: Unzip Project
        run: unzip integrated_project_final.zip

      - name: Locate Source Project
        id: locate_src
        run: |
          SRC_DIR=$(find . -name "pubspec.yaml" -not -path "*/build/*" | head -n 1 | xargs dirname)
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_OUTPUT
          echo "Source project at: $SRC_DIR"

      - name: Generate Build System with flutter create
        run: |
          # flutter create 会生成 v2 embedding 的 MainActivity（com.motong.app.MainActivity）
          BUILD_DIR="motong_build"
          rm -rf "$BUILD_DIR"
          flutter create --org com.motong --project-name motong "$BUILD_DIR"

      - name: Merge lib/ and Android customizations
        run: |
          BUILD_DIR="motong_build"
          SRC_DIR="${{ steps.locate_src.outputs.SRC_DIR }}"

          # 合并六模块的 Dart 源码
          rm -rf "$BUILD_DIR/lib"
          cp -r "$SRC_DIR/lib" "$BUILD_DIR/"

          # 替换 AndroidManifest.xml，并修正 package 属性对齐 com.motong.app
          mkdir -p "$BUILD_DIR/android/app/src/main"
          cp "$SRC_DIR/android/app/src/main/AndroidManifest.xml" \
             "$BUILD_DIR/android/app/src/main/"
          sed -i 's/package="com\.motong"/package="com.motong.app"/' \
             "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name="\.\(MoTongAccessibilityService\|MoTongDeviceAdminReceiver\)"/android:name="com.motong.app.phonecontrol.\1"/g' \
             "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          # 关键：添加 flutterEmbedding v2 meta-data（Flutter 3.29+ 必需，缺失则判定为 v1）
          if ! grep -q 'flutterEmbedding' "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"; then
            sed -i 's|</application>|    <meta-data android:name="flutterEmbedding" android:value="2" />\n</application>|' \
               "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          fi

          # 合并 Kotlin 手机控制模块（plugin 必须正确注册，见下方 MainActivity 修改）
          mkdir -p "$BUILD_DIR/android/app/src/main/kotlin/com/motong/app/phonecontrol"
          cp -r "$SRC_DIR/android/app/src/main/kotlin/com/motong/app/phonecontrol/." \
             "$BUILD_DIR/android/app/src/main/kotlin/com/motong/app/phonecontrol/"

          # 合并 XML 资源（无障碍服务 + 设备管理器）
          mkdir -p "$BUILD_DIR/android/app/src/main/res/xml"
          cp "$SRC_DIR/android/app/src/main/res/xml/"*.xml \
             "$BUILD_DIR/android/app/src/main/res/xml/" 2>/dev/null || true

          # 合并 strings.xml
          mkdir -p "$BUILD_DIR/android/app/src/main/res/values"
          cp "$SRC_DIR/android/app/src/main/res/values/strings.xml" \
             "$BUILD_DIR/android/app/src/main/res/values/" 2>/dev/null || true

          # 合并 pubspec.yaml 依赖声明
          cp "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"

          # 修正 namespace / applicationId 为 com.motong.app
          APP_BUILD="$BUILD_DIR/android/app/build.gradle.kts"
          sed -i 's/namespace = "com\.example\.motong"/namespace = "com.motong.app"/' "$APP_BUILD"
          sed -i 's/applicationId = "com\.example\.motong"/applicationId = "com.motong.app"/' "$APP_BUILD"

          # 改写自动生成的 MainActivity，注册自定义 PhoneControlPlugin（v2 embedding）
          cat > "$BUILD_DIR/android/app/src/main/kotlin/com/motong/app/MainActivity.kt" <<'EOF'
          package com.motong.app

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import com.motong.app.phonecontrol.PhoneControlPlugin

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  flutterEngine.plugins.add(PhoneControlPlugin())
              }
          }
          EOF

          echo "Merged into $BUILD_DIR"

      - name: Fix Dependencies
        working-directory: motong_build
        run: |
          sed -i 's/intl: ^0\.19\.0/intl: ^0.20.2/' pubspec.yaml

      - name: Patch Dart Sources
        working-directory: motong_build
        run: |
          set -e
          LIB="$PWD/lib"

          echo "Patch 1: 函数类型别名 class X = Function() → typedef X = Function()"
          # 原代码把 typedef 写成了 class，例如：
          #   class LlmChatFn = Future<String> Function({...});
          # Dart 解析器把 "class LlmChatFn = ..." 解释成 mixin 声明，
          # 所以报 "Expected 'with' before this."。
          # 正确写法：typedef LlmChatFn = Future<String> Function({...});
          find "$LIB" -name '*.dart' -print0 | xargs -0 sed -i -E \
            -e 's/^class[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=[[:space:]]+(Future|List|Map|String|int|void)/typedef \1 = \2/'

          echo "Patch 2: 修复错误的相对导入 '../../core/' → '../../../core/'"
          # lib/features/<module>/pages/*.dart 里 'import '../../core/...' 实际解析到
          # lib/features/core/...，但实际文件在 lib/core/，所以应该再向上一层。
          # 仅当文件实际位于 pages/ 或更深时才需要替换。
          find "$LIB/features" -name '*.dart' -path '*/pages/*.dart' -print0 | xargs -0 sed -i \
            "s|'\\.\\./\\.\\./core/|'../../../core/|g"

          echo "Patch 3: Material 图标 folder_outline → folder_outlined（Flutter 3.27+ 弃用）"
          find "$LIB" -name '*.dart' -print0 | xargs -0 sed -i \
            -e 's/Icons\.folder_outline\b/Icons.folder_outlined/g'

          echo "Patch 4: lucide_icons paintBrush → brush（包内正确名称）"
          find "$LIB" -name '*.dart' -print0 | xargs -0 sed -i \
            -e 's/LucideIcons\.paintBrush/LucideIcons.brush/g'

          echo "All patches applied."

      - name: Get dependencies
        working-directory: motong_build
        run: flutter pub get

      - name: Build Debug APK
        working-directory: motong_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motong-flutter-debug-apk
        path: motong_build/build/app/outputs/flutter-apk/app-debug.apk