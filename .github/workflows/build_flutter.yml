name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.0'

      - name: Unzip Project
        run: unzip integrated_project_final.zip

      - name: Get dependencies
        run: cd integrated_project_final && flutter pub get

      - name: Build Debug APK
        run: cd integrated_project_final && flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motong-flutter-debug-apk
          path: integrated_project_final/build/app/outputs/flutter-apk/app-debug.apk
